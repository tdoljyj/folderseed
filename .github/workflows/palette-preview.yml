name: Apple-inspired preview (temporary)
on:
  push:
    branches: [palette-preview]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/palette-preview/playwright.config.ts
      - name: Upload palette comparison
        uses: actions/upload-artifact@v4
        with:
          name: folderseed-apple-preview
          path: |
            artifacts/apple-preview/*.png
            artifacts/apple-preview/comparison.html
            artifacts/apple-preview/contrast.json
          retention-days: 1
          if-no-files-found: error
